# Quiz SES — configuration Apache (générée par deploy/install.sh)
# Les règles de sécurité fines (accès interdit à lib/, config, uploads…) sont dans les fichiers .htaccess.
<VirtualHost *:80>
    ServerName __SERVER_NAME__
    DocumentRoot __ROOT__

    <Directory __ROOT__>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:__PHP_SOCK__|fcgi://localhost"
    </FilesMatch>

    ServerSignature Off
    ErrorLog ${APACHE_LOG_DIR}/quiz-ses-error.log
    CustomLog ${APACHE_LOG_DIR}/quiz-ses-access.log combined
</VirtualHost>
