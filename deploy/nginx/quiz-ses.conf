# Quiz SES — configuration nginx (générée par deploy/install.sh)
# Seul api/index.php exécute du PHP ; le code interne, la configuration et les fichiers SQL ne sont jamais servis.
server {
    listen 80__DEFAULT_SERVER__;
    listen [::]:80__DEFAULT_SERVER__;
    server_name __SERVER_NAME__;

    root __ROOT__;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Fichiers internes : jamais accessibles
    location ~ /\.                              { return 404; }
    location ^~ /lib/                           { return 404; }
    location ~* ^/config(\.local)?\.php$        { return 404; }
    location ~* \.(sql|md|log|bak|sh|json|dist)$ { return 404; }

    # Images des questions : servies telles quelles, jamais exécutées
    location ^~ /uploads/ {
        location ~* \.(jpe?g|png|gif|webp)$ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
            expires 30d;
            try_files $uri =404;
        }
        return 404;
    }

    # Unique point d'entrée PHP
    location = /api/index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_read_timeout 30s;
    }
    location ~ \.php$ { return 404; }

    location ^~ /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location = /index.html { expires -1; }
    location / {
        try_files $uri /index.html;
    }
}
